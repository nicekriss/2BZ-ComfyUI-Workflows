name: Update permanent YuE2 download
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yue2-latest
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'yue2-v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python sync_yue2_latest.py
        env:
          GH_TOKEN: ${{ github.token }}
